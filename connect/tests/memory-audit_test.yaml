# Unit tests for connect/memory-audit.yaml (rpk connect test connect/tests/memory-audit_test.yaml)
#
# Inputs are the change envelopes published by connect/pg-cdc.yaml for
# agent_memory.memories: {"change_id", "table", "op", "row_key", "subject",
# "before": {...}|null, "after": {...}|null, "changed_at"}, keyed by row_key.
# Expected outputs are the exact row objects the sql_raw args_mapping reads:
# before_doc/after_doc are JSON text (Go-marshalled, keys sorted) because the
# query casts them with ::jsonb.
tests:
  - name: insert (before null) becomes an insert audit row keyed by change_id
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - metadata:
          kafka_key: '12'
          kafka_topic: agent.pg.memory.cdc
        content: |-
          {"change_id": 41, "table": "memories", "op": "insert", "row_key": 12, "subject": "zeke.dean@redpanda.com", "before": null, "after": {"memory_id": 12, "subject": "zeke.dean@redpanda.com", "kind": "preference", "content": "Prefers short answers", "importance": 3, "source": "agent", "source_ref": "chat:2026-10-21", "created_at": "2026-10-21T16:05:12.178381+00:00", "updated_at": "2026-10-21T16:05:12.178381+00:00", "expires_at": "2027-01-19T16:05:12.178381+00:00"}, "changed_at": "2026-10-21T16:05:12.178381+00:00"}
    output_batches:
      - - json_equals:
            change_id: 41
            memory_id: 12
            subject: zeke.dean@redpanda.com
            op: insert
            before_doc: null
            after_doc: |-
              {"content":"Prefers short answers","created_at":"2026-10-21T16:05:12.178381+00:00","expires_at":"2027-01-19T16:05:12.178381+00:00","importance":3,"kind":"preference","memory_id":12,"source":"agent","source_ref":"chat:2026-10-21","subject":"zeke.dean@redpanda.com","updated_at":"2026-10-21T16:05:12.178381+00:00"}
            changed_at: "2026-10-21T16:05:12.178381+00:00"

  - name: update (before and after) becomes an update audit row with both documents
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - metadata:
          kafka_key: '13'
        content: |-
          {"change_id": 42, "table": "memories", "op": "update", "row_key": 13, "subject": "zeke.dean@redpanda.com", "before": {"memory_id": 13, "subject": "zeke.dean@redpanda.com", "kind": "goal", "content": "Is saving for a house down payment by next June", "importance": 4, "expires_at": "2027-01-19T16:06:00+00:00"}, "after": {"memory_id": 13, "subject": "zeke.dean@redpanda.com", "kind": "goal", "content": "Is saving for a house down payment by next June", "importance": 4, "expires_at": "2026-10-21T16:09:01.5+00:00"}, "changed_at": "2026-10-21T16:09:01.5+00:00"}
    output_batches:
      - - json_equals:
            change_id: 42
            memory_id: 13
            subject: zeke.dean@redpanda.com
            op: update
            before_doc: |-
              {"content":"Is saving for a house down payment by next June","expires_at":"2027-01-19T16:06:00+00:00","importance":4,"kind":"goal","memory_id":13,"subject":"zeke.dean@redpanda.com"}
            after_doc: |-
              {"content":"Is saving for a house down payment by next June","expires_at":"2026-10-21T16:09:01.5+00:00","importance":4,"kind":"goal","memory_id":13,"subject":"zeke.dean@redpanda.com"}
            changed_at: "2026-10-21T16:09:01.5+00:00"

  - name: delete (after null, the hourly purge) becomes a delete audit row
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - metadata:
          kafka_key: '13'
        content: |-
          {"change_id": 43, "table": "memories", "op": "delete", "row_key": 13, "subject": "zeke.dean@redpanda.com", "before": {"memory_id": 13, "subject": "zeke.dean@redpanda.com", "kind": "goal", "content": "Is saving for a house down payment by next June", "importance": 4}, "after": null, "changed_at": "2026-10-21T17:00:00+00:00"}
    output_batches:
      - - json_equals:
            change_id: 43
            memory_id: 13
            subject: zeke.dean@redpanda.com
            op: delete
            before_doc: |-
              {"content":"Is saving for a house down payment by next June","importance":4,"kind":"goal","memory_id":13,"subject":"zeke.dean@redpanda.com"}
            after_doc: null
            changed_at: "2026-10-21T17:00:00+00:00"

  - name: a missing envelope subject falls back to the document
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - content: |-
          {"change_id": 44, "table": "memories", "op": "delete", "row_key": 14, "subject": null, "before": {"memory_id": 14, "subject": "alice@example.com", "content": "Likes tea"}, "after": null, "changed_at": "2026-10-21T17:00:01+00:00"}
    output_batches:
      - - json_equals:
            change_id: 44
            memory_id: 14
            subject: alice@example.com
            op: delete
            before_doc: '{"content":"Likes tea","memory_id":14,"subject":"alice@example.com"}'
            after_doc: null
            changed_at: "2026-10-21T17:00:01+00:00"

  - name: observation written by the observer pipeline is audited like any other insert
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - metadata:
          kafka_key: '15'
        content: |-
          {"change_id": 45, "table": "memories", "op": "insert", "row_key": 15, "subject": "zeke.dean@redpanda.com", "before": null, "after": {"memory_id": 15, "subject": "zeke.dean@redpanda.com", "kind": "observation", "content": "Account 'Everyday Checking' went overdrawn on 2026-10-15: balance moved from 2450.00 to -450.00 USD.", "importance": 4, "source": "event-stream", "source_ref": "accounts/1001@7"}, "changed_at": "2026-10-15T15:12:07+00:00"}
    output_batches:
      - - json_equals:
            change_id: 45
            memory_id: 15
            subject: zeke.dean@redpanda.com
            op: insert
            before_doc: null
            after_doc: |-
              {"content":"Account 'Everyday Checking' went overdrawn on 2026-10-15: balance moved from 2450.00 to -450.00 USD.","importance":4,"kind":"observation","memory_id":15,"source":"event-stream","source_ref":"accounts/1001@7","subject":"zeke.dean@redpanda.com"}
            changed_at: "2026-10-15T15:12:07+00:00"

  - name: malformed (non-JSON) event is dropped, not forwarded
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - metadata:
          kafka_key: '12'
        content: 'this is not a change envelope'
    output_batches: []

  - name: JSON that is not a change envelope is dropped
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - content: '{"hello": "world"}'
    output_batches: []

  - name: mixed batch keeps only envelopes, in order
    target_processors: '../memory-audit.yaml#/pipeline/processors'
    input_batch:
      - content: '{"resolved": "nothing to see"}'
      - metadata:
          kafka_key: '12'
        content: '{"change_id": 46, "table": "memories", "op": "insert", "row_key": 12, "subject": "zeke.dean@redpanda.com", "before": null, "after": {"content": "Prefers short answers", "memory_id": 12, "subject": "zeke.dean@redpanda.com"}, "changed_at": "2026-10-21T18:00:00+00:00"}'
      - metadata:
          kafka_key: '12'
        content: '{"change_id": 47, "table": "memories", "op": "delete", "row_key": 12, "subject": "zeke.dean@redpanda.com", "before": {"content": "Prefers short answers", "memory_id": 12, "subject": "zeke.dean@redpanda.com"}, "after": null, "changed_at": "2026-10-21T18:00:05+00:00"}'
      - content: 'garbage'
    output_batches:
      - - json_equals:
            change_id: 46
            memory_id: 12
            subject: zeke.dean@redpanda.com
            op: insert
            before_doc: null
            after_doc: '{"content":"Prefers short answers","memory_id":12,"subject":"zeke.dean@redpanda.com"}'
            changed_at: "2026-10-21T18:00:00+00:00"
        - json_equals:
            change_id: 47
            memory_id: 12
            subject: zeke.dean@redpanda.com
            op: delete
            before_doc: '{"content":"Prefers short answers","memory_id":12,"subject":"zeke.dean@redpanda.com"}'
            after_doc: null
            changed_at: "2026-10-21T18:00:05+00:00"
