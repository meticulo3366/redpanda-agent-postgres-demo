# pg-agent-memory-audit
#
# Materialises the change stream on agent.pg.memory.cdc into the append-only
# agent_memory.memory_audit table, so every memory write (insert, update, purge
# delete) made by the Memory Concierge is kept as an immutable record.
#
# Contract: docs/PORT-CONTRACT.md section 6. Written for Redpanda Connect 4.69+.
#   lint : rpk connect lint --skip-env-var-check connect/memory-audit.yaml
#   test : rpk connect test connect/tests/memory-audit_test.yaml
#
# In Redpanda Cloud, REDPANDA_BROKERS is a contextual variable and the
# secrets.NAME interpolations resolve from the cluster secret store (scope
# SCOPE_REDPANDA_CONNECT). scripts/40-pipelines.sh uploads this file verbatim;
# with --local it renders a copy that reads plain environment variables
# (secrets.NAME -> NAME) and moves metrics/logger into the streams-mode root
# config. Note: the linter interpolates "dollar-brace" even inside comments,
# so comments here never spell that syntax out.

input:
  redpanda:
    seed_brokers: [ "${REDPANDA_BROKERS}" ]
    tls:
      enabled: true
    sasl:
      - mechanism: SCRAM-SHA-256
        username: "${secrets.AGENT_MEMORY_PG_KAFKA_USER}"
        password: "${secrets.AGENT_MEMORY_PG_KAFKA_PASSWORD}"
    topics: [ "agent.pg.memory.cdc" ]
    consumer_group: agent-memory-pg-audit
    start_offset: earliest
    commit_period: 1s

pipeline:
  processors:
    # One change envelope in, one memory_audit row out (or nothing). The
    # envelope (connect/pg-cdc.yaml) is {"change_id", "table", "op", "row_key",
    # "subject", "before": {...}|null, "after": {...}|null, "changed_at"}.
    - label: audit_row
      mapping: |
        # Anything that is not a change envelope is dropped.
        root = if !this.exists("change_id") || !this.exists("op") || !this.exists("row_key") {
          deleted()
        } else {
          {
            # change_id is the idempotency key (UNIQUE in memory_audit).
            "change_id": this.change_id,
            "memory_id": this.row_key,
            # subject from the envelope, else after, else before (deletes only have before).
            "subject": this.subject.or(this.after.subject.or(this.before.subject)),
            "op": this.op,
            # JSONB columns: pass the documents as JSON text ($5::jsonb, $6::jsonb).
            "before_doc": if this.before != null { this.before.string() } else { null },
            "after_doc": if this.after != null { this.after.string() } else { null },
            "changed_at": this.changed_at
          }
        }
    # A malformed event must never poison a batch: log it and drop it.
    - catch:
        - log:
            level: ERROR
            message: 'pg-agent-memory-audit: dropping malformed change event: ${! error() }'
        - mapping: root = deleted()

output:
  sql_raw:
    driver: postgres
    dsn: "${secrets.AGENT_MEMORY_PG_DSN}"
    query: >-
      INSERT INTO agent_memory.memory_audit (change_id, memory_id, subject, op, before_doc, after_doc, changed_at)
      VALUES ($1::bigint,$2::bigint,$3,$4,$5::jsonb,$6::jsonb,$7::timestamptz)
      ON CONFLICT (change_id) DO NOTHING
    # The row object is produced (and unit tested) by the audit_row processor
    # above; this mapping only reads its fields in placeholder order.
    args_mapping: |
      root = [ this.change_id, this.memory_id, this.subject, this.op, this.before_doc, this.after_doc, this.changed_at ]
    max_in_flight: 2
    batching:
      count: 100
      period: 1s

# Service-wide fields (stripped by scripts/40-pipelines.sh --local, where they
# move into the streams-mode root config).
metrics:
  prometheus: {}

logger:
  level: INFO
